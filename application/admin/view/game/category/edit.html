<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Pid')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pid" data-rule="required" data-source="/index" class="form-control selectpage" name="row[pid]" type="text" value="{$row.pid|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Abbr')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-abbr" class="form-control" name="row[abbr]" type="text" value="{$row.abbr|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Image')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-image" class="form-control" name="row[image]" type="text" value="{$row.image|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Thumb')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-thumb" class="form-control" name="row[thumb]" type="text" value="{$row.thumb|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Bg_image')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bg_image" class="form-control" name="row[bg_image]" type="text" value="{$row.bg_image|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Left_image')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-left_image" class="form-control" name="row[left_image]" type="text" value="{$row.left_image|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Activity_ids')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-activity_ids" class="form-control" name="row[activity_ids]" type="text" value="{$row.activity_ids|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_nav')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_nav" class="form-control selectpicker" name="row[is_nav]">
                {foreach name="isNavList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.is_nav"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_home_show')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_home_show" class="form-control selectpicker" name="row[is_home_show]">
                {foreach name="isHomeShowList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.is_home_show"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_left_show')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_left_show" class="form-control selectpicker" name="row[is_left_show]">
                {foreach name="isLeftShowList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.is_left_show"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Direction')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-direction" class="form-control selectpicker" name="row[direction]">
                {foreach name="directionList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.direction"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Config')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <dl class="fieldlist" data-name="row[config]">
                <dd>
                    <ins>{:__('Key')}</ins>
                    <ins>{:__('Value')}</ins>
                </dd>
                <dd><a href="javascript:;" class="btn btn-sm btn-success btn-append"><i class="fa fa-plus"></i> {:__('Append')}</a></dd>
                <textarea name="row[config]" class="form-control hide" cols="30" rows="5">{$row.config|htmlentities}</textarea>
            </dl>


        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Range')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-range" class="form-control datetimerange" data-locale='{"format":"YYYY-MM-DD HH:mm:ss"}' name="row[range]" type="text" value="{$row.range|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" class="form-control" name="row[remark]" type="text" value="{$row.remark|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Weigh')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-weigh" class="form-control" name="row[weigh]" type="number" value="{$row.weigh|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_download')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-is_download" class="form-control" name="row[is_download]" type="number" value="{$row.is_download|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
